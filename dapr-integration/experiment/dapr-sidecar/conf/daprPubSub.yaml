apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: pulsar-pubsub
spec:
  type: pubsub.pulsar
  version: v1
  metadata:
    # TLS variant (with auth): pulsar+ssl://maas-proxy:6651
    - name: host
      value: "pulsar://maas-proxy:6650"
    - name: enableTLS
      value: "false"

    # topics are published with bare names; the component builds
    # persistent://<tenant>/<namespace>/<topic>
    - name: tenant
      value: "tenant"
    - name: namespace
      value: "namespace"
    - name: persistent
      value: "true"
