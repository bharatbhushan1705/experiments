# daprd-consumer subscribes to cots-topic and delivers each message as an
# HTTP POST to the cots-client consumer. Scoped to cots-consumer so only the
# consumer sidecar subscribes.
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: cots-topic-subscription
spec:
  pubsubname: pulsar-pubsub
  topic: cots-topic
  routes:
    default: /messages
  metadata:
    rawPayload: "true"
    consumerID: cots-consumer
scopes:
  - cots-consumer
