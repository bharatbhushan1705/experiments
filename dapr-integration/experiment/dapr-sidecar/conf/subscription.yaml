# reverse flow: daprd-consumer subscribes to the topic and delivers each message
# as an HTTP POST to the cots-client consumer. Scoped to cots-consumer so the
# producer-side daprd does not subscribe (a durable subscription would collect
# backlog from the forward-flow bursts).
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: topic-subscription
spec:
  pubsubname: pulsar-pubsub
  topic: topic
  routes:
    default: /messages
  metadata:
    rawPayload: "true"
    consumerID: cots-consumer
scopes:
  - cots-consumer
