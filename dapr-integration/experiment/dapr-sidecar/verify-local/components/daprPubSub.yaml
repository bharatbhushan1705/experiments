apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: pulsar-pubsub
spec:
  # Same wiring as the deliverable component: BUILT-IN pubsub.pulsar, TLS transport
  # without verification or authentication. Only tenant/namespace differ (standalone
  # ships public/default out of the box).
  type: pubsub.pulsar
  version: v1
  metadata:
    - name: host
      value: "pulsar+ssl://pulsar:6651"
    - name: enableTLS
      value: "false"
    - name: tenant
      value: "public"
    - name: namespace
      value: "default"
    - name: persistent
      value: "true"
