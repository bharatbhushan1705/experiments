# Self-contained verification of the no-auth setup (public images only).
#
# Proves the pipeline with Dapr's BUILT-IN Pulsar component:
#   producer (curl loop)
#     -> daprd (built-in pubsub.pulsar)
#     -> Pulsar standalone with a TLS listener and authentication DISABLED
#   consumer reads the topic back.
#
# Orchestrated by verify.sh.
name: dapr-builtin-verify

services:
  certs-init:
    image: ubuntu:latest
    volumes:
      - certs:/certs
      - ./gen-test-certs.sh:/gen-test-certs.sh:ro
    environment:
      OUT_DIR: /certs/pulsar
    command: ["/bin/bash", "/gen-test-certs.sh"]

  # stand-in for the platform: TLS listener, authentication DISABLED.
  pulsar:
    image: apachepulsar/pulsar:4.1.0
    hostname: pulsar
    volumes:
      - certs:/certs
      - ./pulsar-standalone-tls.sh:/pulsar-standalone-tls.sh:ro
    command: ["/bin/bash", "/pulsar-standalone-tls.sh"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6651' 2>/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 40s

  daprd:
    image: daprio/daprd:1.15.4
    depends_on:
      pulsar:
        condition: service_healthy
    volumes:
      - ./components:/components:ro
    command:
      - "./daprd"
      - "--app-id"
      - "curl-producer"
      - "--dapr-http-port"
      - "3500"
      - "--resources-path"
      - "/components"
      - "--log-level"
      - "debug"

  # bare topic name — the built-in component prefixes persistent://public/default/
  producer:
    image: curlimages/curl:latest
    environment:
      DAPR_HTTP: "http://daprd:3500"
      PUBSUB_NAME: "pulsar-pubsub"
      TOPIC: "topic"
      INTERVAL: "1"
    depends_on:
      daprd:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until curl -fsS "$${DAPR_HTTP}/v1.0/healthz" >/dev/null 2>&1; do
          echo "waiting for daprd..."; sleep 2
        done
        echo "publishing to topic '$${TOPIC}' every $${INTERVAL}s via $${DAPR_HTTP}"
        i=0
        while true; do
          i=$$((i+1))
          BODY="{\"id\":$$i,\"source\":\"curl-producer\",\"ts\":\"$$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"text\":\"hello from curl-producer #$$i\"}"
          if curl -fsS -X POST -H "Content-Type: application/json" -d "$$BODY" \
               "$${DAPR_HTTP}/v1.0/publish/$${PUBSUB_NAME}/$${TOPIC}?metadata.rawPayload=true" >/dev/null; then
            echo "PUBLISHED $$BODY"
          else
            echo "PUBLISH FAILED (#$$i)"
          fi
          sleep "$${INTERVAL}"
        done

  consumer:
    image: apachepulsar/pulsar:4.1.0
    environment:
      client_brokerServiceUrl: pulsar+ssl://pulsar:6651
      client_tlsAllowInsecureConnection: "true"
      client_tlsEnableHostnameVerification: "false"
      client_useKeyStoreTls: "false"
    command:
      - bash
      - -c
      - |
        bin/apply-config-from-env-with-prefix.py client_ conf/client.conf && \
        exec bin/pulsar-client consume persistent://public/default/topic \
          -s verify-sub -p Earliest -n 0

volumes:
  certs:
