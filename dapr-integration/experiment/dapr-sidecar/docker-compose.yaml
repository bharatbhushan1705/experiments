name: pulsar-dapr

networks:
  default:
    name: maas-platform-experiment-network
    external: true

services:
  daprd-producer:
    image: daprio/daprd:1.15.4
    container_name: daprd-producer
    volumes:
      - ./conf:/conf:ro
    command:
      - "./daprd"
      - "--app-id"
      - "cots-client"
      - "--dapr-http-port"
      - "3500"
      - "--resources-path"
      - "/conf"
      - "--log-level"
      - "info"
      # logs every publish API call; remove if too noisy at burst rates
      - "--enable-api-logging"
    ports:
      - "3500:3500"

# sidecar for the cots-client consumer; picks up daprConsumerPubSub.yaml
# and POSTs each cots-topic message to the consumer container
  daprd-consumer:
    image: daprio/daprd:1.15.4
    container_name: daprd-consumer
    volumes:
      - ./conf:/conf:ro
    command:
      - "./daprd"
      - "--app-id"
      - "cots-consumer"
      - "--app-port"
      - "8080"
      - "--app-channel-address"
      - "cots-consumer"
      - "--dapr-http-port"
      - "3501"
      - "--resources-path"
      - "/conf"
      - "--log-level"
      - "info"
      - "--enable-api-logging"
