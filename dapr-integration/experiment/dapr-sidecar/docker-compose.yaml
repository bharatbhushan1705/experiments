# The Dapr sidecar for the experiment, targeting the local platform cluster
# (authentication DISABLED on the platform — see conf/daprPubSub.yaml).
#
# This stack is ONLY the messaging middleware:
#   daprd (built-in pubsub.pulsar) -> platform proxy (pulsar+ssl://maas-proxy:6651)
#
# The producer lives in ../cots-client — any COTS app with HTTP/curl capability
# publishes via daprd's API without knowing anything about Pulsar.
# Effective topic: persistent://tenant/namespace/<bare-topic> (the built-in component
# adds the tenant/namespace prefix from conf/daprPubSub.yaml).
name: pulsar-dapr

networks:
  default:
    name: maas-platform-experiment-network
    external: true

services:
  daprd:
    image: daprio/daprd:1.15.4
    container_name: daprd
    volumes:
      - ./conf:/conf:ro
    command:
      - "./daprd"
      - "--app-id"
      - "cots-client"
      - "--dapr-http-port"
      - "3500"
      - "--resources-path"
      - "/conf"
      - "--log-level"
      - "debug"
    ports:
      - "3500:3500"   # publish from the host too: see README

  # OPTIONAL verification consumer — NOT started by default (the pulsar-client stack
  # is the real consumer). Enable with:  docker compose --profile consumer up -d
  consumer:
    image: apachepulsar/pulsar:4.1.0
    container_name: dapr-experiment-consumer
    profiles: ["consumer"]
    environment:
      client_brokerServiceUrl: pulsar+ssl://maas-proxy:6651
      client_tlsAllowInsecureConnection: "true"
      client_tlsEnableHostnameVerification: "false"
      client_useKeyStoreTls: "false"
      tenantName: "${TENANT:-tenant}"
      namespaceName: "${NAMESPACE:-namespace}"
      topicName: "${TOPIC:-topic}"
    command:
      - bash
      - -c
      - |
        bin/apply-config-from-env-with-prefix.py client_ conf/client.conf && \
        exec bin/pulsar-client consume "persistent://$${tenantName}/$${namespaceName}/$${topicName}" \
          -s dapr-experiment-consumer -p Earliest -n 0
    restart: unless-stopped
