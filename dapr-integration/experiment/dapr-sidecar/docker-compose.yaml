name: pulsar-dapr

networks:
  default:
    name: maas-platform-experiment-network
    external: true

services:
  daprd:
    image: daprio/daprd:1.15.4
    container_name: daprd
    volumes:
      - ./conf:/conf:ro
    command:
      - "./daprd"
      - "--app-id"
      - "cots-client"
      - "--dapr-http-port"
      - "3500"
      - "--resources-path"
      - "/conf"
      - "--log-level"
      - "debug"
    ports:
      - "3500:3500"
