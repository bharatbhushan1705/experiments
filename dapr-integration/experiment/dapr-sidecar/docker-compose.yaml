# The Dapr side of the experiment, targeting the local platform cluster
# (authentication DISABLED on the platform — see daprPubSub.yaml for why that
# allows the BUILT-IN Dapr Pulsar component with no pluggable container).
#
#   producer (curl loop)
#     -> daprd  (built-in pubsub.pulsar from daprPubSub.yaml)
#     -> platform proxy over TLS transport, no auth (pulsar+ssl://maas-proxy:6651)
#   optional profile-gated consumer reads the topic back.
#
# Effective topic: persistent://tenant/namespace/${TOPIC:-topic} — the built-in
# component adds the tenant/namespace prefix (from daprPubSub.yaml), so the producer
# publishes with the BARE topic name.
name: pulsar-dapr

networks:
  default:
    name: maas-platform-experiment-network
    external: true

services:
  daprd:
    image: daprio/daprd:1.15.4
    volumes:
      - ./daprPubSub.yaml:/components/daprPubSub.yaml:ro
    command:
      - "./daprd"
      - "--app-id"
      - "curl-producer"
      - "--dapr-http-port"
      - "3500"
      - "--resources-path"
      - "/components"
      - "--log-level"
      - "debug"
    ports:
      - "3500:3500"   # also lets you publish manually: see README

  # ---- the producer: a curl loop posting to Dapr's publish API ----
  # TOPIC is the BARE name (built-in component prefixes tenant/namespace itself).
  producer:
    image: curlimages/curl:latest
    environment:
      DAPR_HTTP: "http://daprd:3500"
      PUBSUB_NAME: "pulsar-pubsub"
      TOPIC: "${TOPIC:-topic}"
      INTERVAL: "${PUBLISH_INTERVAL:-1}"
    depends_on:
      daprd:
        condition: service_started
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until curl -fsS "$${DAPR_HTTP}/v1.0/healthz" >/dev/null 2>&1; do
          echo "waiting for daprd..."; sleep 2
        done
        echo "publishing to topic '$${TOPIC}' every $${INTERVAL}s via $${DAPR_HTTP} (component adds persistent://tenant/namespace/)"
        i=0
        while true; do
          i=$$((i+1))
          BODY="{\"id\":$$i,\"source\":\"curl-producer\",\"ts\":\"$$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"text\":\"hello from curl-producer #$$i\"}"
          if curl -fsS -X POST -H "Content-Type: application/json" -d "$$BODY" \
               "$${DAPR_HTTP}/v1.0/publish/$${PUBSUB_NAME}/$${TOPIC}?metadata.rawPayload=true" >/dev/null; then
            echo "PUBLISHED $$BODY"
          else
            echo "PUBLISH FAILED (#$$i)"
          fi
          sleep "$${INTERVAL}"
        done

  # OPTIONAL verification consumer — NOT started by default (the pulsar-client stack
  # is the real consumer). Enable with:  docker compose --profile consumer up -d
  consumer:
    image: apachepulsar/pulsar:4.1.0
    container_name: dapr-experiment-consumer
    profiles: ["consumer"]
    environment:
      client_brokerServiceUrl: pulsar+ssl://maas-proxy:6651
      client_tlsAllowInsecureConnection: "true"
      client_tlsEnableHostnameVerification: "false"
      client_useKeyStoreTls: "false"
      tenantName: "${TENANT:-tenant}"
      namespaceName: "${NAMESPACE:-namespace}"
      topicName: "${TOPIC:-topic}"
    command:
      - bash
      - -c
      - |
        bin/apply-config-from-env-with-prefix.py client_ conf/client.conf && \
        exec bin/pulsar-client consume "persistent://$${tenantName}/$${namespaceName}/$${topicName}" \
          -s dapr-experiment-consumer -p Earliest -n 0
    restart: unless-stopped
