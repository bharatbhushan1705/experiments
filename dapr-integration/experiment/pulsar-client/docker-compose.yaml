  consumer:
    image: p10530maasacr.azurecr.io/ing-maas-pulsar:${revision}
    container_name: maas-consumer
    environment:
      PULSAR_LOG_LEVEL: INFO
      client_webServiceUrl: http://host.docker.internal:8080
      client_brokerServiceUrl: pulsar://host.docker.internal:6650
      # the image's client.conf has baked keystore/auth defaults; blank them explicitly
      client_tlsKeyStorePath: ''
      client_tlsTrustStorePath: ''
      client_useKeyStoreTls: 'false'
      client_authPlugin: ''
      client_authParams: ''
      # TLS variant (re-enable with auth):
#      client_webServiceUrl: https://host.docker.internal:8081
#      client_brokerServiceUrl: pulsar+ssl://host.docker.internal:6651
#      client_tlsAllowInsecureConnection: true
# identities mounts + PEM utilities are only needed with cert auth (disabled)
#    volumes:
#      - ../.ignore.identities/admin:/data/client
#      - ../.ignore.identities/trust:/data/trust
#    depends_on:
#      openssl-keystore-utility:
#        condition: service_completed_successfully
#      openssl-truststore-utility:
#        condition: service_completed_successfully
    command:
      - bash
      - -c
      - |
        bin/apply-config-from-env-with-prefix.py client_ conf/client.conf && \
        bin/pulsar-perf consume persistent://${tenantName:-tenant}/${namespaceName:-namespace}/topic -s subscription -time 0
