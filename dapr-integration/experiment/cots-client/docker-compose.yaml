# producer (produce.sh): curl bursts through the Dapr sidecar to 'topic'
# consumer (consume.py): http server receiving 'cots-topic' messages from the consumer sidecar
# Env:
#   DAPR_HTTP     dapr base URL                        (default http://daprd-producer:3500)
#   TOPIC         bare topic name                      (default topic)
#   BURST         messages per burst                   (default 1000)
#   PARALLEL_MAX  parallel connections                 (default 50)
#   LOG_EVERY     log every Nth burst / Nth message    (default 10)
#   RATE          paced mode, e.g. 1/s, 30/m, 500/s    (default unset = burst mode)
name: cots-client

networks:
  default:
    name: maas-platform-experiment-network
    external: true

services:
  producer:
    image: curlimages/curl:latest
    container_name: cots-producer
    environment:
      DAPR_HTTP: "${DAPR_HTTP:-http://daprd-producer:3500}"
      PUBSUB_NAME: "${PUBSUB_NAME:-pulsar-pubsub}"
      TOPIC: "${TOPIC:-topic}"
      BURST: "${BURST:-1000}"
      PARALLEL_MAX: "${PARALLEL_MAX:-50}"
      LOG_EVERY: "${LOG_EVERY:-10}"
      RATE: "${RATE:-}"
    restart: unless-stopped
    # bursts churn ~50 new connections each; reuse TIME_WAIT sockets so the
    # ephemeral port range does not run out at high rates
    sysctls:
      net.ipv4.tcp_tw_reuse: "1"
    volumes:
      - ./produce.sh:/produce.sh:ro
    entrypoint: ["/bin/sh"]
    command: ["/produce.sh"]

  consumer:
    image: python:3-alpine
    container_name: cots-consumer
    restart: unless-stopped
    environment:
      LOG_EVERY: "${LOG_EVERY:-10}"
    volumes:
      - ./consume.py:/consume.py:ro
    command: ["python3", "-u", "/consume.py"]
