# producer: curl bursts through the Dapr sidecar to 'topic'
# consumer: http server receiving 'cots-topic' messages from the consumer sidecar
# Env:
#   DAPR_HTTP     dapr base URL          (default http://daprd-producer:3500)
#   TOPIC         bare topic name        (default topic)
#   BURST         messages per burst     (default 1000)
#   PARALLEL_MAX  parallel connections   (default 50)
name: cots-client

networks:
  default:
    name: maas-platform-experiment-network
    external: true

services:
  producer:
    image: curlimages/curl:latest
    container_name: cots-producer
    environment:
      DAPR_HTTP: "${DAPR_HTTP:-http://daprd-producer:3500}"
      PUBSUB_NAME: "${PUBSUB_NAME:-pulsar-pubsub}"
      TOPIC: "${TOPIC:-topic}"
      BURST: "${BURST:-1000}"
      PARALLEL_MAX: "${PARALLEL_MAX:-50}"
    restart: unless-stopped
    # bursts churn ~50 new connections each; reuse TIME_WAIT sockets so the
    # ephemeral port range does not run out at high rates
    sysctls:
      net.ipv4.tcp_tw_reuse: "1"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        URL="$${DAPR_HTTP}/v1.0/publish/$${PUBSUB_NAME}/$${TOPIC}?metadata.rawPayload=true"
        until curl -fsS "$${DAPR_HTTP}/v1.0/healthz" >/dev/null 2>&1; do
          echo "waiting for daprd at $${DAPR_HTTP}..."; sleep 2
        done
        i=0; while [ "$$i" -lt "$${BURST}" ]; do echo "url = \"$$URL\""; i=$$((i+1)); done > /tmp/urls.cfg
        echo "publishing bursts of $${BURST} msgs (parallel-max $${PARALLEL_MAX}) to topic '$${TOPIC}'"
        S=$$(date +%s); b=0
        while :; do
          b=$$((b+1))
          BODY="{\"burst\":$$b,\"source\":\"cots-client\",\"text\":\"hello from cots-client burst $$b\"}"
          if ERR=$$(curl -fsS -Z --parallel-max "$${PARALLEL_MAX}" --parallel-immediate -X POST \
               -H "Content-Type: application/json" -d "$$BODY" --config /tmp/urls.cfg 2>&1 >/dev/null); then
            E=$$(date +%s); D=$$((E-S)); [ "$$D" -eq 0 ] && D=1
            echo "burst $$b: $$((b*BURST)) msgs total, ~$$((b*BURST/D)) msg/s"
          else
            echo "burst $$b: FAILED ($$(echo "$$ERR" | grep -c .) of $${BURST} requests, first: $$(echo "$$ERR" | head -1))"
            sleep 1
          fi
        done

  consumer:
    image: python:3-alpine
    container_name: cots-consumer
    restart: unless-stopped
    command:
      - python3
      - -u
      - -c
      - |
        from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
        import base64, json, time
        class Handler(BaseHTTPRequestHandler):
            def do_POST(self):
                body = self.rfile.read(int(self.headers.get('Content-Length') or 0))
                # dapr delivers the raw pulsar payload base64-wrapped in a cloudevent
                try:
                    event = json.loads(body)
                    msg = base64.b64decode(event['data_base64']).decode() if 'data_base64' in event else event.get('data', body.decode(errors='replace'))
                except Exception:
                    msg = body.decode(errors='replace')
                print(time.strftime('%H:%M:%S'), self.path, msg, flush=True)
                self.send_response(200)
                self.end_headers()
            def do_GET(self):
                self.send_response(200)
                self.end_headers()
            def log_message(self, *args):
                pass
        print('listening on :8080', flush=True)
        ThreadingHTTPServer(('0.0.0.0', 8080), Handler).serve_forever()
