apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: pulsar-pubsub
spec:
  # Same wiring as the deliverable component: built-in pubsub.pulsar, plain TCP to the
  # local bridge, which owns mTLS to Pulsar. Only difference vs the deliverable is the
  # tenant/namespace (standalone ships public/default out of the box) and the bridge
  # host alias (pulsar-bridge -> whichever bridge profile is active).
  type: pubsub.pulsar
  version: v1
  metadata:
    - name: host
      value: "pulsar-bridge:6650"
    - name: enableTLS
      value: "false"
    - name: tenant
      value: "public"
    - name: namespace
      value: "default"
    - name: persistent
      value: "true"
