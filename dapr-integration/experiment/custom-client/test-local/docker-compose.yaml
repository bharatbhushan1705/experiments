# Self-contained VERIFICATION harness (public images only, no Dockerfiles).
#
# Proves the exact deliverable pipeline without the real ING platform:
#   custom-client (Java, HTTPS self-signed)
#        -> Dapr sidecar (built-in pubsub.pulsar, plain)
#        -> bridge (ghostunnel OR haproxy) that adds mTLS client cert
#        -> Pulsar standalone that REQUIRES a trusted client cert (mTLS)
#   consumer (pulsar CLI) reads the topic back directly over mTLS.
#
# Two bridge profiles share the network alias "pulsar-bridge" (the Dapr component
# host), so only one runs at a time:
#   --profile ghostunnel   (works when the server cert has a DNS SAN)
#   --profile haproxy      (works with SPIFFE-URI-only server certs; skips hostname)
#
# Orchestrated by verify.sh (staged startup). Not meant to be `up`'d all at once.
name: custom-client-verify

services:
  # --- one-shot: generate the throwaway Pulsar PKI (CA + server + client) ---
  certs-init:
    image: ubuntu:latest
    volumes:
      - certs:/certs
      - ./gen-test-certs.sh:/gen-test-certs.sh:ro
    environment:
      OUT_DIR: /certs/pulsar
      URI_ONLY: "${URI_ONLY:-false}"
      FORCE: "${FORCE_CERTS:-false}"
    command: ["/bin/bash", "/gen-test-certs.sh"]

  # --- one-shot: generate the app's self-signed HTTPS keystore ---
  app-cert-init:
    image: ubuntu:latest
    volumes:
      - certs:/certs
      - ../scripts/gen-app-cert.sh:/gen-app-cert.sh:ro
    environment:
      OUT_DIR: /certs
      KEYSTORE_PASSWORD: changeme
    command: ["/bin/bash", "/gen-app-cert.sh"]

  # --- stand-in for the mTLS-secured platform Pulsar ---
  pulsar:
    image: apachepulsar/pulsar:4.1.0
    hostname: pulsar
    volumes:
      - certs:/certs
      - ./pulsar-standalone-tls.sh:/pulsar-standalone-tls.sh:ro
    environment:
      ANONYMOUS_ROLE: "${ANONYMOUS_ROLE:-}"
    command: ["/bin/bash", "/pulsar-standalone-tls.sh"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6651' 2>/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 40s

  # --- bridge option A: ghostunnel (requires DNS SAN on the server cert) ---
  ghostunnel:
    image: ghostunnel/ghostunnel:latest
    profiles: ["ghostunnel"]
    networks:
      default:
        aliases: [pulsar-bridge]
    volumes:
      - certs:/certs:ro
    # target host "pulsar" matches DNS:pulsar in the server cert, so no
    # --override-server-name is needed here.
    command:
      - client
      - --listen=0.0.0.0:6650
      - --unsafe-listen
      - --target=pulsar:6651
      - --cert=/certs/pulsar/client.crt
      - --key=/certs/pulsar/client.key
      - --cacert=/certs/pulsar/ca.pem

  # --- bridge option B: haproxy (verifies CA chain, SKIPS hostname; SPIFFE-URI ok) ---
  haproxy:
    image: haproxy:2.9
    profiles: ["haproxy"]
    networks:
      default:
        aliases: [pulsar-bridge]
    volumes:
      - certs:/certs:ro
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro

  # --- the Dapr sidecar (built-in Pulsar component, plain -> bridge) ---
  daprd:
    image: daprio/daprd:1.15.4
    volumes:
      - ./components:/components:ro
    command:
      - "./daprd"
      - "--app-id"
      - "custom-client"
      - "--app-protocol"
      - "https"
      - "--app-port"
      - "8443"
      - "--app-channel-address"
      - "custom-client"
      - "--dapr-http-port"
      - "3500"
      - "--resources-path"
      - "/components"
      - "--log-level"
      - "debug"

  # --- the custom Java producer (HTTPS self-signed) ---
  custom-client:
    image: eclipse-temurin:21-jdk
    hostname: custom-client
    working_dir: /app
    volumes:
      - ../app:/app:ro
      - certs:/certs:ro
    environment:
      DAPR_HTTP: "http://daprd:3500"
      PUBSUB_NAME: "pulsar-pubsub"
      TOPIC: "custom-client-topic"
      APP_PORT: "8443"
      KEYSTORE_PATH: "/certs/app-keystore.p12"
      KEYSTORE_PASSWORD: "changeme"
      PUBLISH_COUNT: "10"
      PUBLISH_INTERVAL_MS: "500"
    command: ["java", "CustomClient.java"]

  # --- consumer: reads the topic straight from Pulsar over mTLS ---
  consumer:
    image: apachepulsar/pulsar:4.1.0
    volumes:
      - certs:/certs:ro
    environment:
      client_brokerServiceUrl: pulsar+ssl://pulsar:6651
      client_authPlugin: org.apache.pulsar.client.impl.auth.AuthenticationTls
      client_authParams: tlsCertFile:/certs/pulsar/client.crt,tlsKeyFile:/certs/pulsar/client.key
      client_tlsAllowInsecureConnection: "true"
      client_tlsEnableHostnameVerification: "false"
      client_useKeyStoreTls: "false"
    command:
      - bash
      - -c
      - |
        bin/apply-config-from-env-with-prefix.py client_ conf/client.conf && \
        exec bin/pulsar-client consume persistent://public/default/custom-client-topic \
          -s test-sub -p Earliest -n 0

volumes:
  certs:
