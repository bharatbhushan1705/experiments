# HAProxy mTLS-termination bridge (verification harness).
# Accepts PLAINTEXT Pulsar traffic from Dapr on :6650 and forwards it to the
# mTLS-secured Pulsar on :6651, presenting the client certificate.
#
# Key point vs ghostunnel: `verify required` validates the server's CA chain, but
# because NO `verifyhost` is set, HAProxy does NOT check the server hostname. That is
# what lets this bridge work with SPIFFE-URI-only server certs (the platform's posture,
# mirroring client.conf's tlsEnableHostnameVerification=false).
global
    log stdout format raw local0 info

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 10s
    timeout client  1h
    timeout server  1h

frontend pulsar_in
    bind :6650
    default_backend pulsar_out

backend pulsar_out
    server pulsar pulsar:6651 ssl crt /certs/pulsar/client-combined.pem ca-file /certs/pulsar/ca.pem verify required
